[profile.default]
src = "contracts"
out = "out"
libs = [
    "lib",
    "node_modules",
]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false

# Base Chain Configuration
[rpc_endpoints]
base_mainnet = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"  # Testnet
base_goerli = "https://goerli.base.org"    # Deprecated but might still work

[etherscan]
base_mainnet = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

# Chain IDs
# Base Mainnet: 8453
# Base Sepolia (Testnet): 84532
# Base Goerli: 84531 (deprecated)

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
    "forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
    "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
