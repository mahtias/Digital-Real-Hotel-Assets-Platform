# foundry.toml

[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

# Compiler settings
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Enable gas reports and auto remappings
gas_reports = ["*"]
auto_detect_remappings = true

# Remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@chainlink/=lib/chainlink/contracts/src/",
]

# Code formatting
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

# Production profile 
[profile.production]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
via_ir = true

# Test profile 
[profile.test]
solc_version = "0.8.24"
optimizer = false
fuzz = { runs = 256 }

# Fuzz testing configuration
[fuzz]
runs = 256
max_test_rejects = 65536
seed = '0x1'

# RPC endpoints
[rpc_endpoints]
base_sepolia = "https://base-sepolia.g.alchemy.com/v2/w4sdyVuAlr44h9jRAE08y"
base_mainnet = "${BASE_MAINNET_RPC_URL}"
localhost = "http://127.0.0.1:8545"

# Etherscan verification

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=84532" }
base = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=8453" }