[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version  = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
 via_ir = true  

# Enable auto remappings
auto_detect_remappings = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@chainlink/=lib/chainlink/contracts/src/",
]

[rpc_endpoints]
base_sepolia = "https://base-sepolia.g.alchemy.com/v2/w4sdyVuAlr44h9jRAE08y"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
