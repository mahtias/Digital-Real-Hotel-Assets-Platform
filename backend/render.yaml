services:
  - type: web
    name: digirealassets-api
    runtime: node
    rootDir: backend
    buildCommand: |
      npm install
      npx prisma generate
      npx prisma migrate deploy
    startCommand: npm start
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL                    # ← PostgreSQL connection
        fromDatabase:
          name: digirealassets-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://digirealassets.vercel.app

databases:
  - name: digirealassets-db
    databaseName: digirealassets
    user: digirealuser
    plan: free
    region: oregon
    ipAllowList: []
